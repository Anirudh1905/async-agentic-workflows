[project]
name = "async-agentic-workflows"
version = "0.1.0"
description = "Async agentic workflows: a LangGraph agent run as Temporal workflows, with Kafka events, auth and Redis rate limiting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.32.0",
    "ddgs>=9.16.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent = "agentic_workflows.agent.cli:main"
worker = "agentic_workflows.workflows.worker:main"
consumer = "agentic_workflows.consumers.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
ui = [
    "streamlit>=1.65.0",
]
